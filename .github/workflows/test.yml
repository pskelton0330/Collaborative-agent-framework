name: tests

on:
  push:
  pull_request:

jobs:
  smoke:
    name: smoke (${{ matrix.os }}, jq=${{ matrix.jq }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        jq: [with-jq, no-jq]
    steps:
      - uses: actions/checkout@v4

      - name: Remove jq (no-jq matrix leg)
        if: matrix.jq == 'no-jq'
        shell: bash
        run: |
          # Exercise the jq-optional fallback paths end to end.
          sudo rm -f "$(command -v jq)" || true
          if command -v jq >/dev/null 2>&1; then echo "jq still present"; exit 1; fi

      - name: Ensure jq present (with-jq matrix leg)
        if: matrix.jq == 'with-jq'
        shell: bash
        run: command -v jq || (sudo apt-get update && sudo apt-get install -y jq) || brew install jq

      - name: Run smoke tests under /bin/sh
        run: /bin/sh tests/run-tests.sh

      - name: Run smoke tests under dash (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y dash
          dash tests/run-tests.sh
